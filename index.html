<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  
  <meta name="theme-color" content="#f83f3f">
  <title>Login - Branch Attendance</title>
  <link rel="icon" type="image/png"href="./assets/images/icon.png">
  <link rel="stylesheet" href="./assets/css/mobil.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Art Group">
  <link rel="apple-touch-icon" href="./assets/images/icon.png">
</head>

<div class="login-card">
  <div class="logo">
    <img src="./assets/images/logo.png" alt="logo">
  </div>

  <p class="app-title">Art Group</p>
  <span class="app-sub">Staffmanage System</span>

  <div class="status-mssg"><p id="status-mssg"></p></div>

  <div class="input-group">
    <input type="text" id="email" placeholder="Username">
    <span class="icon">📧</span>
  </div>

  <div class="input-group">
    <input type="password" id="pass" placeholder="Password">
    <span class="icon">🔒</span>
  </div>

  <button id="signInBtn" class="login-btn">Login</button>
  <button id="enableLocationBtn" class="login-btn" style="display:none; margin-top:8px; margin-left: 43px;">Enable Location</button>

  <div class="links">
    <a href="tel:8943359116">Help</a>
    <a href="tel:8943359150">Forgot?</a>
    <a href="#" id="clearCacheBtn" style="color: #f83f3f; cursor: pointer;">Clear Cache</a>
  </div>
</div>

  <script type="module" src="./assets/js/auth.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js')
      .then(() => console.log("Service Worker registered"))
      .catch(err => console.error("SW registration failed", err));
  }

  document.getElementById('clearCacheBtn').addEventListener('click', (e) => {
    e.preventDefault();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names)
          caches.delete(name);
      });
    }
    alert('Cache cleared! The app will now reload.');
    window.location.reload(true);
  });
</script>
</body>
</html>
